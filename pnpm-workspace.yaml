packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security: force patched transitive deps (pnpm audit)
overrides:
  sharp: '>=0.35.0'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.18'
  browserslist: '>=4.28.7'
  js-yaml: '>=4.3.1'
  'brace-expansion@>=4': '>=5.0.9'
  'minimatch@^3>brace-expansion': '^1.1.18'
  'mermaid>dompurify': '>=3.4.13'
