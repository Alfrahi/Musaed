version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Alfrahi"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Node dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Alfrahi"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
