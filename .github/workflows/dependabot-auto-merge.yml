name: Dependabot auto-merge

# Auto-approves and squash-merges Dependabot PRs whose resolved update type is
# minor or patch (incl. grouped minor/patch groups). Major-version bumps still
# require manual review. Merging only happens once required CI checks pass --
# branch protection supplies the gating, requiring "validate" + tests to be green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for non-major dependency updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
