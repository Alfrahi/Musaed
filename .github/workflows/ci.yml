name: Musaed CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_HOME: /home/runner/.local/share/pnpm

jobs:
  # ── Job 1: Lint + Type-check + Architecture ─────────────
  validate:
    name: Lint · Type · Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type-check
        run: pnpm type-check

      - name: Architecture boundary check
        run: |
          pnpm codegen:feature-deps:check
          pnpm arch-check
          pnpm test:arch

      - name: i18n compliance
        run: pnpm --filter web i18n:check

      - name: Validation constants sync
        run: pnpm codegen:validation:check

      - name: IPC contract validation (baseline)
        run: pnpm validate:contracts

      - name: IPC contract validation (strict)
        run: pnpm validate:contracts --strict

      - name: IPC ACL coverage (commands ⇄ permissions)
        run: pnpm validate:acl

      - name: No sub-path imports of @musaed/contracts
        run: |
          matches=$(grep -RE --include='*.ts' --include='*.tsx' --include='*.rs' --include='*.js' --include='*.mjs' "from '@musaed/contracts/[^']+'" apps/ src-tauri/ || true)
          if [ -n "$matches" ]; then
            echo "❌ Found sub-path import(s) of @musaed/contracts/* — re-export from packages/contracts/src/index.ts instead (STANDARDS.md §5 PUBLIC RE-EXPORT RULE)."
            echo "$matches"
            exit 1
          fi

      - name: No TODOs/FIXMEs
        run: |
          if grep -rE "\bTODO\b|\bFIXME\b|\bHACK\b" apps/web/src --include="*.ts" --include="*.tsx" --exclude-dir={test,tests}; then
            echo "❌ Found TODO/FIXME comments in source."
            exit 1
          fi

  # ── Job 2: Tests ────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Security: audit JS deps against the GitHub advisory DB; fails on moderate+ vulnerabilities
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate

      - name: Run unit tests
        run: pnpm test

  # ── Job 3: Rust checks ─────────────────────────────────
  rust:
    name: Rust · Format · Clippy · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cargo fmt
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Security: audit Rust deps against RustSec advisories; fails on known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Job 4: Visual Regression Tests (RTL) ─────────────────
  visual-tests:
    name: Visual Tests · RTL (Non-blocking)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true # Allow failure until baselines stabilize
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Playwright browsers
        run: |
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm exec playwright install chromium --with-deps

      - name: Run visual regression tests
        run: |
          cd apps/web
          pnpm exec playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: apps/web/test-results/
          retention-days: 7

  # ── Job 5: Build verification ────────────────────────────
  build:
    name: Build · Static Export
    runs-on: ubuntu-latest
    needs: [test, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build frontend (static export)
        run: pnpm --filter web build

      - name: Verify static output exists
        run: test -d apps/web/out && echo "✅ Static export verified"
