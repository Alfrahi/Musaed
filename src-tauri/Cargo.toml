[package]
name = "musaed"
version = "0.1.0"
description = "Native local AI interface for Ollama"
authors = ["Musaed Contributors"]
edition = "2021"

[lib]
name = "musaed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-single-instance = "2.0"
rand = "0.8"
scopeguard = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

# HTTP + Streaming
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async
tokio = { version = "1", features = ["full", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

futures = "0.3"

# Concurrency
dashmap = "6"

# Logging & Diagnostics
log = { version = "0.4", features = ["std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# RAG — Vector store
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"

# RAG — File traversal (ripgrep's ignore crate)
ignore = "0.4"

# RAG — AST-aware code chunking
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"

# RAG — Language detection for BM25
whatlang = "0.16"

# RAG — Hashing for content deduplication
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# RAG — UUID for project/chunk IDs
uuid = { version = "1", features = ["v4", "serde"] }

# RAG — Directory traversal fallback
walkdir = "2"

# Desktop only
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
mockito = "1.5"
tempfile = "3"
