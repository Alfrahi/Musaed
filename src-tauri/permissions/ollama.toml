[[permission]]
identifier = "allow-ollama-commands"
description = "Enables interaction with the local Ollama node."
commands.allow = [
    "get_ollama_models",
    "chat_with_ollama",
    "pull_model",
    "abort_pull",
    "delete_model",
    "abort_chat",
    "check_ollama_health",
    "validate_model",
    "verify_ollama_service",
]
