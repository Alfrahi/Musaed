[[permission]]
identifier = "allow-rag-commands"
description = "Enables RAG project management, indexing, and search commands."
commands.allow = [
    "cmd_rag_add_project",
    "cmd_rag_remove_project",
    "cmd_rag_update_project",
    "cmd_rag_list_projects",
    "cmd_rag_get_project",
    "cmd_rag_index_project",
    "cmd_rag_abort_index",
    "cmd_rag_reindex_project",
    "cmd_rag_get_index_status",
    "cmd_rag_search",
    "cmd_rag_get_file_chunks",
    "cmd_cmd_rag_get_project_stats",
    "cmd_rag_set_embedding_model",
    "cmd_rag_validate_embedding_model"
]
